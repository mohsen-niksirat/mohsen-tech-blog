---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.tags %}
        <span class="tags">{% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<div class="social-sharing">
  <p>Share this post:</p>
  <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | uri_escape }}&text={{ page.title | uri_escape }}" target="_blank" rel="noopener">Twitter</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | uri_escape }}" target="_blank" rel="noopener">LinkedIn</a>
  <a href="mailto:?subject={{ page.title | uri_escape }}&body=Check out this article: {{ page.url | absolute_url | uri_escape }}" target="_blank">Email</a>
</div>

<section class="comments" style="margin-top: 3rem;">
  <h3>Comments</h3>
  <script src="https://utteranc.app/client.js"
      repo="mohsen-niksirat/mohsen-tech-blog"
      issue-term="pathname"
      theme="github-light"
      crossorigin="anonymous"
      async>
  </script>
</section>

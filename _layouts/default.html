<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon-192.png' | relative_url }}">
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script defer src="{{ '/assets/main.js' | relative_url }}"></script>

  {% if jekyll.environment == 'production' %}
    <!-- Plausible Analytics (privacy-focused) -->
    <script defer data-domain="mohsen-tech-blog.com" src="https://plausible.io/js/script.js"></script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/archive' | relative_url }}">Archive</a>
        <a href="{{ '/projects' | relative_url }}">Projects</a>
        <a href="{{ '/search' | relative_url }}">Search</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>

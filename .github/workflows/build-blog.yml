name: Build Engineering Monograph

on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/style.css"
      - "assets/app.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile static bilingual pages
        run: node scripts/build.mjs
      - name: Commit generated output if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: rebuild static monograph pages"
            git push origin master
          fi

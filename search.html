---
layout: default
title: Search
permalink: /search/
---

<h1>Search Posts</h1>

<div class="search-container">
  <input type="text" id="search-input" placeholder="Search posts by title or content..." autocomplete="off">
  <div id="search-results"></div>
</div>

<!-- Lunr.js for client-side search -->
<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Build the index
    const documents = [
      {% for post in site.posts %}
      {
        id: '{{ post.url }}',
        title: '{{ post.title | escape }}',
        content: '{{ post.content | strip_html | strip_newlines | escape }}',
        date: '{{ post.date | date: "%Y-%m-%d" }}',
        url: '{{ post.url }}',
        tags: '{{ post.tags | join: ", " }}'
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    // Create the lunr index
    const idx = lunr(function () {
      this.ref('id');
      this.field('title', { boost: 10 });
      this.field('content');
      this.field('tags');

      documents.forEach(doc => {
        this.add(doc);
      });
    });

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', function() {
      const query = searchInput.value.trim();
      searchResults.innerHTML = '';

      if (!query) {
        searchResults.innerHTML = '<p class="search-help">Type to search for posts...</p>';
        return;
      }

      const results = idx.search(query);
      const limitedResults = results.slice(0, 10);

      if (limitedResults.length === 0) {
        searchResults.innerHTML = '<p class="search-no-results">No posts found matching your search.</p>';
        return;
      }

      limitedResults.forEach(result => {
        const doc = documents.find(d => d.id === result.ref);
        if (!doc) return;

        const resultElement = document.createElement('div');
        resultElement.className = 'search-result';

        const dateFormatted = new Date(doc.date).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        resultElement.innerHTML = `
          <h3><a href="${doc.url}">${doc.title}</a></h3>
          <p class="search-result-meta"><time>${dateFormatted}</time>${doc.tags ? '<span class="search-result-tags">' + doc.tags + '</span>' : ''}</p>
        `;
        searchResults.appendChild(resultElement);
      });
    });

    // Initial message
    searchResults.innerHTML = '<p class="search-help">Type to search for posts...</p>';
  });
</script>

<style>
.search-container {
  margin: 2rem 0;
}

#search-input {
  width: 100%;
  padding: 0.7rem 1rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
  outline: none;
}

#search-input:focus {
  border-color: #4a90d9;
}

.search-result {
  padding: 1rem 0;
  border-bottom: 1px solid var(--border);
}

.search-result:last-child {
  border-bottom: none;
}

.search-result h3 {
  margin-bottom: 0.3rem;
}

.search-result-meta {
  color: var(--muted);
  font-size: 0.85rem;
}

.search-result-tags {
  margin-left: 0.5rem;
  color: #4a90d9;
}

.search-help {
  color: var(--muted);
  font-style: italic;
}

.search-no-results {
  color: var(--muted);
}
</style>
